services:
  dialogspy:
    build: .
    container_name: dialogspy-bot
    restart: always          # автозапуск + перезапуск при падении
    env_file:
      - .env
    environment:
      DB_PATH: /app/data/messages.db    # override so DB lands on the volume
      MEDIA_DIR: /app/data/media        # keep downloaded media on the volume too
    volumes:
      - ./data:/app/data     # persist messages.db + media across restarts
    # Healthcheck: процесс python должен быть жив
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f run.py || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
